<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Mockup</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #f1f5f9;
            padding: 40px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .result-card {
            background: #fff;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-body {
            padding: 16px;
        }

        .item-code {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .item-name {
            font-size: 13px;
            color: #475569;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .meta-item {
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            border-radius: 6px;
        }

        /* 1. MẪU HIỆN TẠI (IN YSD) - NORMAL */
        .loc-normal {
            background: #e0f2fe;
            color: #0369a1;
            padding: 6px 8px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 2. MẪU OUT TRONG YSD */
        .loc-out-inside {
            background: #fefce8;
            border: 1px solid #fef08a;
            color: #854d0e;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 2px;
        }

        /* 3. MẪU OUT NGOÀI YSD */
        .loc-out-outside {
            background: #fff7ed;
            border: 1px solid #ffedd5;
            color: #c2410c;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 2px;
        }

        .badge-status {
            font-size: 12px;
            font-weight: bold;
            padding: 6px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .badge-in { background: #dcfce7; color: #15803d; }
        .badge-out { background: #fee2e2; color: #b91c1c; }

    </style>
</head>
<body>

    <!-- THẺ 1: BÌNH THƯỜNG -->
    <div class="result-card">
        <div class="card-body">
            <div class="item-code">MTM-195 R1</div>
            <div class="item-name">TRAY SPACER 200x200</div>
            
            <div style="display:flex; gap: 8px; width:100%; margin-top: 12px;">
                <div class="meta-item loc-normal" style="flex: 1;">
                    <i class="fas fa-map-marker-alt" style="margin-right:4px;"></i> 71-1
                </div>
                
                <div class="meta-item badge-status badge-in" style="width: 70px;">
                    <i class="fas fa-arrow-circle-down" style="margin-right:2px;"></i> IN
                </div>
            </div>
            <div style="font-size:11px; color:#94a3b8; font-weight:600; text-align:center; margin-top:8px;">
                Mẫu hiện tại (Khuôn bình thường)
            </div>
        </div>
    </div>

    <!-- THẺ 2: OUT NHƯNG Ở YSD -->
    <div class="result-card">
        <div class="card-body">
            <div class="item-code">SMK-229 R3</div>
            <div class="item-name">INSERT TRAY PS</div>
            
            <div style="display:flex; gap: 8px; width:100%; margin-top: 12px;">
                <!-- MOCKUP PROPOSAL -->
                <div class="meta-item loc-out-inside" style="flex: 1;">
                    <div style="font-size:9px; color:#a16207; font-weight:700;">
                        <i class="fas fa-undo"></i> Trả về: 71-1
                    </div>
                    <div style="font-size:13px; font-weight:900; color:#d97706;">
                        <i class="fas fa-map-marker-alt"></i> 台湾機成形
                    </div>
                </div>
                <!-- ================ -->

                <div class="meta-item badge-status badge-out" style="width: 70px;">
                    <i class="fas fa-arrow-circle-up" style="margin-right:2px;"></i> OUT
                </div>
            </div>
             <div style="font-size:11px; color:#94a3b8; font-weight:600; text-align:center; margin-top:8px;">
                Đề xuất OUT nội bộ YSD
            </div>
        </div>
    </div>

    <!-- THẺ 3: OUT NGOÀI YSD -->
    <div class="result-card">
        <div class="card-body">
            <div class="item-code">JAE-376 R2</div>
            <div class="item-name">PS 16 BOX</div>
            
            <div style="display:flex; gap: 8px; width:100%; margin-top: 12px;">
                <!-- MOCKUP PROPOSAL -->
                <div class="meta-item loc-out-outside" style="flex: 1;">
                    <div style="font-size:9px; color:#c2410c; font-weight:700;">
                        <i class="fas fa-undo"></i> Trả về: (Phòng khuôn)
                    </div>
                    <div style="font-size:13px; font-weight:900; color:#ea580c;">
                        <i class="fas fa-building"></i> Tại: MARUDAI
                    </div>
                </div>
                <!-- ================ -->

                <div class="meta-item badge-status badge-out" style="width: 70px;">
                    <i class="fas fa-arrow-circle-up" style="margin-right:2px;"></i> OUT
                </div>
            </div>
             <div style="font-size:11px; color:#94a3b8; font-weight:600; text-align:center; margin-top:8px;">
                Đề xuất OUT ngoại trú
            </div>
        </div>
    </div>

</body>
</html>
